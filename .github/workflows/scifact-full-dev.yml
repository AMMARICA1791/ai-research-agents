name: SciFact Full Dev NLI Evaluation

on:
  pull_request:
    paths:
      - 'research/run_scifact_full_dev.py'
      - '.github/workflows/scifact-full-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.40,<5' sentencepiece
      - name: Run real model on ALL annotated SciFact dev rationale cases
        run: python -m research.run_scifact_full_dev --output-dir scifact-full-evaluation
      - name: Upload evaluation report and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scifact-full-dev-results
          path: |
            scifact-full-evaluation/report.json
            scifact-full-evaluation/errors.json
            scifact-full-evaluation/predictions.json
          if-no-files-found: warn
