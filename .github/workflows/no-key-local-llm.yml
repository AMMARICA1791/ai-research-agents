name: Zero-Key Local Qwen Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/no-key-local-llm.yml'

permissions:
  contents: write

concurrency:
  group: lab-knowledge-serialized
  cancel-in-progress: false

jobs:
  real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LAB_MODEL_BACKEND: ollama
      OLLAMA_HOST: 127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python HTTP client
        run: python -m pip install requests==2.32.2
      - name: Restore sanitized persistent research memory
        run: |
          set -euo pipefail
          mkdir -p .data
          git fetch --no-tags origin refs/heads/lab-memory:refs/remotes/origin/lab-memory
          git show refs/remotes/origin/lab-memory:knowledge/state.json > .data/knowledge.json
          python - <<'PY'
          from lab.knowledge import load_state
          state = load_state('.data/knowledge.json')
          print("RESTORED KNOWLEDGE RUNS:", len(state["runs"]))
          PY
      - name: Install local Ollama runtime (no API keys)
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          ollama --version
      - name: Start localhost-only model server
        run: |
          set -euo pipefail
          OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "LOCAL_MODEL_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          echo "Ollama did not become ready"
          tail -n 30 /tmp/ollama-server.log
          exit 1
      - name: Download free open-weight Qwen model (~398 MB)
        run: |
          timeout 300 ollama pull qwen2.5:0.5b
      - name: Run real multi-role research with local inference
        run: |
          python -m lab.cli mission --repo . \
            --goal "Audit this open-source research lab and describe concrete software checks" \
            --knowledge .data/knowledge.json \
            --output results/no-key-model-mission.json > /tmp/no-key-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('results/no-key-model-mission.json').read_text())
          provider = data["report"]["model"]
          assert provider["mode"] == "local_model", provider["mode"]
          assert len(provider["reviews"]) == 2
          assert all(x["text"].strip() for x in provider["reviews"])
          assert data["report"]["validation"]["changes_applied"] is False
          assert data["report"]["prior_knowledge"]["previous_runs"] >= 1
          assert data["report"]["prior_knowledge"]["lessons"]
          assert data["report"]["work_orders"]
          from lab.knowledge import load_state
          knowledge = load_state('.data/knowledge.json')
          assert len(knowledge['runs']) == data["report"]["prior_knowledge"]["previous_runs"] + 1
          assert knowledge['runs'][-1]['model_mode'] == 'local_model'
          print("PRIOR_KNOWLEDGE_RUNS=" + str(data["report"]["prior_knowledge"]["previous_runs"]))
          print("CURRENT_KNOWLEDGE_RUNS=" + str(len(knowledge['runs'])))
          print("SELF_IMPROVEMENT_WORK_ORDERS=" + str(len(data["report"]["work_orders"])))
          print("LIVE_FREE_LOCAL_INFERENCE_CONFIRMED")
          print("MODEL=" + provider["model"])
          print("REAL_MODEL_REVIEWS=" + str(len(provider["reviews"])))
          print("RESEARCH_ROLE_STAGES=" + str(len(data["agent_stages"])))
          for item in provider["reviews"]:
              print("REVIEWER=" + item["role"] + " | " + item["text"][:350].replace("\n"," "))
          PY
      - name: Persist only sanitized aggregate knowledge to dedicated branch
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/lab-memory" refs/remotes/origin/lab-memory
          mkdir -p "$RUNNER_TEMP/lab-memory/knowledge"
          cp .data/knowledge.json "$RUNNER_TEMP/lab-memory/knowledge/state.json"
          git -C "$RUNNER_TEMP/lab-memory" config user.name "ai-research-lab[bot]"
          git -C "$RUNNER_TEMP/lab-memory" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/lab-memory" add knowledge/state.json
          if git -C "$RUNNER_TEMP/lab-memory" diff --cached --quiet; then
            echo "Knowledge journal unchanged."
          else
            git -C "$RUNNER_TEMP/lab-memory" commit -m "chore(memory): persist redacted research aggregates [skip ci]"
            git -C "$RUNNER_TEMP/lab-memory" push origin HEAD:refs/heads/lab-memory
          fi
      - name: Save research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-key-local-qwen-research
          path: results/no-key-model-mission.json
          if-no-files-found: warn
          retention-days: 7
