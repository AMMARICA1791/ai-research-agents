name: Research Gap Radar
on:
  push:
    branches: [experiment/research-gap-radar]
    paths:
      - 'experiments/research_gap_radar/**'
      - '.github/workflows/research_gap_radar.yml'
  pull_request:
    paths:
      - 'experiments/research_gap_radar/**'
      - '.github/workflows/research_gap_radar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/research_gap_radar -p 'test_*.py' -v
