name: Verify MVP
on:
  push:
    branches:
      - 'release/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q agents research experiments lab web main.py run_server.py
      - name: Run integration tests
        run: python -m pytest -q tests/test_mvp.py tests/test_lab.py
      - name: Run internal laboratory self-research
        run: |
          python -m lab.cli mission --repo . --goal "Audit our own research laboratory and propose evidence-based improvements" --output results/ci-mission.json > /tmp/ci-mission-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('results/ci-mission.json').read_text())
          assert result['agent_stages'] == ['explorer', 'analyst', 'engineer', 'validator', 'synthesizer']
          assert result['report']['validation']['changes_applied'] is False
          assert all(p['status'] == 'pending_review' for p in result['proposals'])
          print('SELF RESEARCH COMPLETED:', result['id'])
          PY
      - name: Smoke test live localhost HTTP server
        run: |
          set -euo pipefail
          python main.py > /tmp/mvp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/mvp-health.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ > /tmp/mvp-home.html
          curl -fsS http://127.0.0.1:8000/api/lab/status > /tmp/lab-status.json
          curl -fsS http://127.0.0.1:8000/api/demo > /tmp/mvp-demo.json
          curl -fsS --data-urlencode 'repo_path=.' http://127.0.0.1:8000/api/analyze > /tmp/mvp-analyze.json
          python - <<'PY'
          import json
          from pathlib import Path
          h = json.loads(Path('/tmp/mvp-health.json').read_text())
          demo = json.loads(Path('/tmp/mvp-demo.json').read_text())
          analysis = json.loads(Path('/tmp/mvp-analyze.json').read_text())
          assert h['status'] == 'ok', h
          assert demo['summary']['python_files'] >= 10, demo['summary']
          assert analysis['summary']['total_files'] >= 20, analysis['summary']
          assert 'AI Research Agents' in Path('/tmp/mvp-home.html').read_text()
          assert json.loads(Path('/tmp/lab-status.json').read_text())['purpose'] == 'internal_research'
          print('LIVE HTTP SMOKE TEST PASSED:', analysis['summary']['total_files'], 'files')
          PY
