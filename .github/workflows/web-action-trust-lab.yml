name: Web Action Trust Lab
on:
  push:
    branches: [experiment/web-action-trust-lab]
    paths:
      - 'experiments/web_action_trust_lab/**'
      - '.github/workflows/web-action-trust-lab.yml'
  pull_request:
    paths:
      - 'experiments/web_action_trust_lab/**'
      - '.github/workflows/web-action-trust-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline policy tests
        run: python -m unittest discover -s experiments/web_action_trust_lab -p 'test_*.py' -v
