name: Rapid Radar Anticipatory Prototypes
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  anticipate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: radar-project-incubator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s experiments/rapid_project_radar -p 'test_*.py' -v
      - name: Collect early signals
        run: python -m experiments.rapid_project_radar.radar --output /tmp/rapid-radar-report.json
      - name: Generate isolated prototype templates
        run: python -m experiments.rapid_project_radar.anticipate --report /tmp/rapid-radar-report.json --output-dir /tmp/anticipatory-projects
      - name: Read historical project portfolio
        continue-on-error: true
        env:
          GH_TOKEN: \${{ github.token }}
        run: python -m experiments.rapid_project_radar.portfolio --repo \${{ github.repository }} --output /tmp/radar-portfolio.json
      - name: Generate successor experiments from distinct new questions
        run: |
          if [ -f /tmp/radar-portfolio.json ]; then
            python -m experiments.rapid_project_radar.successors --projects /tmp/anticipatory-projects --portfolio /tmp/radar-portfolio.json --output-dir /tmp/anticipatory-projects --limit 12
          else
            echo "::warning::Historical inventory unavailable; skip successor generation rather than invent lineage."
          fi
      - name: Council peer review and priority triage
        run: |
          if [ -f /tmp/radar-portfolio.json ]; then
            python -m experiments.rapid_project_radar.council --projects /tmp/anticipatory-projects --portfolio /tmp/radar-portfolio.json
          else
            python -m experiments.rapid_project_radar.council --projects /tmp/anticipatory-projects
          fi
      - name: Run experiments and preserve failures as learning
        run: |
          set -eu
          for dir in /tmp/anticipatory-projects/*; do
            [ -d "$dir" ] || continue
            if (cd "$dir" && python -m unittest discover -s . -p 'test_*.py' -v); then
              touch "$dir/.tests-passed"
              PYTHONPATH="$GITHUB_WORKSPACE" python -m experiments.rapid_project_radar.learning --project "$dir" --outcome PASS --observation "Initial scaffold tests passed; scientific hypothesis remains unverified."
            else
              PYTHONPATH="$GITHUB_WORKSPACE" python -m experiments.rapid_project_radar.learning --project "$dir" --outcome FAIL --observation "Initial scaffold tests failed; preserve this experiment for investigation." --correction "Inspect test output, revise hypothesis or implementation, and retry."
            fi
          done
      - name: Publish new isolated project branches
        # Publish tested, source-linked projects; the next step merges eligible PRs.
        # Publication only follows successful unit tests and candidate generation.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in /tmp/anticipatory-projects/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/.tests-passed" ] || { echo "::warning::Skip untested or failed project: $dir"; continue; }
            project_id="$(basename "$dir")"
            branch="radar/incubator-$project_id"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Existing incubator branch: $project_id"
              existing_pr="$(gh pr list --state all --head "$branch" --json number --jq '.[0].number // empty')"
              if [ -n "$existing_pr" ]; then
                echo "Already has PR #$existing_pr: $project_id"
              else
                if ! gh pr create --base main --head "$branch" --draft --title "Radar incubator: $project_id (signal prototype)" --body "Automated trusted-template scaffold, not a validated invention. Generated from a radar signal. Initial tests required; eligible projects are merged automatically into main."; then
                  echo "::warning::Existing branch still has no PR: $branch"
                fi
              fi
              continue
            fi
            git switch -c "$branch" origin/main
            mkdir -p "projects/incubator/$project_id"
            cp -R "$dir"/. "projects/incubator/$project_id/"
            rm -f "projects/incubator/$project_id/.tests-passed"
            git add "projects/incubator/$project_id"
            git commit -m "experiment: incubate $project_id from radar signal"
            git push origin "$branch"
            if ! gh pr create --base main --head "$branch" --draft --title "Radar incubator: $project_id (signal prototype)" --body "Automated trusted-template scaffold, not a validated invention. Generated from a radar signal. Initial tests required; eligible projects are merged automatically into main."; then
              echo "::warning::Branch published but PR creation unavailable; inspect $branch"
            fi
            git switch --detach "${{ github.sha }}"
            git branch -D "$branch"
          done
      - name: Merge tested signal projects into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for dir in /tmp/anticipatory-projects/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/.tests-passed" ] || continue
            project_id="$(basename "$dir")"
            branch="radar/incubator-$project_id"
            pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
            [ -n "$pr_number" ] || { echo "::warning::No open PR for tested project: $project_id"; continue; }
            if [ "$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')" = "true" ]; then
              if ! gh pr ready "$pr_number"; then
                echo "::warning::Cannot mark PR #$pr_number ready; retry next cycle."
                continue
              fi
            fi
            if gh pr merge "$pr_number" --squash; then
              echo "Merged tested signal project into main: $project_id (PR #$pr_number)"
            else
              echo "::warning::Merge pending or blocked for PR #$pr_number; retry next cycle without bypassing branch protections."
            fi
          done
      - name: Merge previously generated radar projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Recover open radar PRs even when their source signals are no longer in today's report.
          # Process a bounded batch each run to keep the five-minute schedule sustainable.
          gh pr list --state open --limit 200 --json number,headRefName --jq '.[] | select(.headRefName | startswith("radar/incubator-")) | [.number, .headRefName] | @tsv' > /tmp/radar-open-prs.tsv
          processed=0
          while IFS="$(printf '\t')" read -r pr_number branch; do
            [ -n "$pr_number" ] || continue
            [ "$processed" -lt 20 ] || break
            processed=$((processed + 1))
            project_id="${branch#radar/incubator-}"
            tmp="$(mktemp -d)"
            if ! git fetch --depth=1 origin "$branch"; then
              echo "::warning::Unable to fetch project branch $branch"
              rm -rf "$tmp"
              continue
            fi
            if ! git archive FETCH_HEAD "projects/incubator/$project_id" | tar -x -C "$tmp"; then
              echo "::warning::Unable to read project files for $branch"
              rm -rf "$tmp"
              continue
            fi
            project="$tmp/projects/incubator/$project_id"
            if [ ! -f "$project/test_prototype.py" ] || ! (cd "$project" && python -m unittest discover -s . -p 'test_*.py' -v); then
              echo "::warning::Tests failed or missing for $branch; no merge"
              rm -rf "$tmp"
              continue
            fi
            rm -rf "$tmp"
            if [ "$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')" = "true" ]; then
              if ! gh pr ready "$pr_number"; then
                echo "::warning::Unable to mark PR #$pr_number ready"
                continue
              fi
            fi
            if gh pr merge "$pr_number" --squash; then
              echo "Merged backlog project $project_id via PR #$pr_number"
            else
              echo "::warning::GitHub blocked PR #$pr_number; protections remain enforced"
            fi
          done < /tmp/radar-open-prs.tsv
      - name: Upload prototype archive
        uses: actions/upload-artifact@v4
        with:
          name: anticipatory-projects
          path: /tmp/anticipatory-projects/
          if-no-files-found: warn
          retention-days: 14
