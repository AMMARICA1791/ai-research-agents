name: Primary Paper Evidence Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/primary_pdf_audit.py'
      - 'research/claim_scope_review.py'
      - 'research/two_paper_gate.py'
      - 'research/scientific_acceptance.py'
      - 'research/scientific_comparison_engine.py'
      - 'research/bounded_entailment.py'
      - 'research/real_paper_probe.py'
      - 'tests/test_real_paper_probe.py'
      - 'tests/test_bounded_entailment.py'
      - 'tests/fixtures/bounded_entailment_cases.json'
      - 'tests/test_scientific_comparison_engine.py'
      - 'tests/test_scientific_acceptance.py'
      - 'tests/test_two_paper_gate.py'
      - 'tests/test_claim_scope_review.py'
      - 'research/independent_evidence_review.py'
      - 'tests/test_independent_evidence_review.py'
      - 'tests/test_primary_pdf_audit.py'
      - 'tests/test_paper_evidence.py'
      - 'tests/test_primary_paper_provenance.py'
      - '.github/workflows/paper-evidence-pilot.yml'

permissions:
  contents: read

jobs:
  offline-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest==8.3.2
          python -m compileall -q research tests
          python -m pytest -q tests/test_paper_evidence.py tests/test_primary_paper_provenance.py tests/test_primary_pdf_audit.py tests/test_independent_evidence_review.py tests/test_claim_scope_review.py tests/test_two_paper_gate.py tests/test_scientific_acceptance.py tests/test_scientific_comparison_engine.py tests/test_bounded_entailment.py tests/test_real_paper_probe.py

  primary-source:
    needs: offline-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and extract primary PDF text
        run: |
          mkdir -p results
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 'https://articles.adsabs.harvard.edu/pdf/1995ApJS..101..181W' -o results/primary.pdf
          pdfinfo results/primary.pdf | head -n 16
          pdftotext -raw results/primary.pdf results/primary.txt
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 'https://arxiv.org/pdf/astro-ph/0002337' -o results/type-ia.pdf
          pdftotext -raw results/type-ia.pdf results/type-ia.txt
          python -m compileall -q research tests
          python -m research.two_paper_gate --core-collapse results/primary.txt --type-ia results/type-ia.txt --output results/two-paper-comparison.json
          python -m research.bounded_entailment --cases tests/fixtures/bounded_entailment_cases.json --output results/bounded-entailment-benchmark.json
          python -m research.scientific_comparison_engine --core-collapse results/primary.txt --type-ia results/type-ia.txt --output results/scientific-comparison.json
          python -m research.real_paper_probe --comparison results/scientific-comparison.json --output results/real-paper-probe.json
          python -m research.scientific_acceptance --comparison results/two-paper-comparison.json --output results/scientific-acceptance.json
          sha256sum results/primary.pdf results/primary.txt | tee results/source-digests.txt
          python -m research.primary_pdf_audit --source results/primary.txt --output results/primary-evidence-audit.json
          python -m research.independent_evidence_review --source results/primary.txt --audit results/primary-evidence-audit.json --output results/independent-scientific-scope-review.json
          python -m research.claim_scope_review --source results/primary.txt --output results/claim-scope-review.json
      - name: Publish primary-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-paper-evidence-audit
          path: |
            results/primary-evidence-audit.json
            results/independent-scientific-scope-review.json
            results/claim-scope-review.json
            results/two-paper-comparison.json
            results/scientific-acceptance.json
            results/scientific-comparison.json
            results/bounded-entailment-benchmark.json
            results/real-paper-probe.json
            results/source-digests.txt
          if-no-files-found: warn
