name: Source-Grounded Paper Excerpt Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excerpt-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify quote matching (offline)
        run: |
          python -m pip install pytest==8.3.2
          python -m pytest -q tests/test_paper_evidence.py
      - name: Install local model runtime
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          timeout 300 ollama pull qwen2.5:0.5b
      - name: Analyze clearly labeled synthetic excerpt
        run: |
          python -m research.paper_evidence --source tests/fixtures/iron_synthetic_excerpt.txt --output results/paper-evidence.json
          python - <<'PY'
          import json
          d=json.load(open("results/paper-evidence.json"))
          assert d["scientific_truth_verified"] is False
          assert set(d["evidence"]) == {"hypothesis","methods","evidence","findings","limitations"}
          print("PILOT_QUOTE_VALIDATION_COMPLETE")
          for k,v in d["evidence"].items():
              print(k, v["status"])
          PY
      - name: Publish evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-grounded-excerpt-pilot
          path: results/paper-evidence.json
          if-no-files-found: warn
