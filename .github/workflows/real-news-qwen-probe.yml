name: Real-News Qwen Evidence Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-news-qwen-probe.yml
      - research/live_news_research.py
      - research/news_eval.py
      - research/news_probe_audit.py
      - research/news_semantic_review.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sources-and-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Archive authentic public news sources (no fabricated fixture)
        run: |
          mkdir -p research_output
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from research.live_news_research import collect, dossier

          urls = [
              "https://deepmind.google/blog/gemini-4-argon-for-robotics/",
              "https://deepmind.google/blog/introducing-synthid-bio/",
              "https://deepmind.google/blog/advancing-private-ai-compute-with-secure-server-side-memory/",
              "https://deepmind.google/blog/piloting-the-worlds-first-double-blind-ai-evaluations/",
              "https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/",
          ]
          rows = []
          for url in urls:
              case = {"url": url}
              try:
                  page = collect(url)
                  evidence = dossier(page, "What is actually supported by this excerpt?")
                  if len(evidence["source_excerpt"].strip()) < 150:
                      raise ValueError("Extracted source excerpt too short for evaluation")
                  if "Explore our next generation AI systems" in evidence["source_excerpt"][:500]:
                      raise ValueError("Navigation-dominated excerpt is not valid news evidence")
                  case.update(retrieval_status="ARTICLE_RETRIEVED", evidence=evidence)
              except Exception as exc:
                  case.update(retrieval_status="ARTICLE_NOT_RETRIEVED",
                              error=f"{type(exc).__name__}: {exc}"[:300])
              rows.append(case)
              print(case["retrieval_status"], url, case.get("error", ""))
          report = {
              "generated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "status": "LIVE_SOURCES_NOT_INDEPENDENTLY_VERIFIED",
              "article_cases": rows,
              "limitations": [
                  "Single-publisher news set is not independent corroboration",
                  "HTML excerpts may include navigation text and are capped at 1200 characters",
                  "No human gold labels or semantic correctness established"
              ]
          }
          Path("research_output/news_qwen_sources.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          retrieved = sum(x["retrieval_status"] == "ARTICLE_RETRIEVED" for x in rows)
          print("REAL_SOURCES_RETRIEVED:", retrieved, "/", len(rows))
          if retrieved == 0:
              raise SystemExit("FAIL_CLOSED: no real article excerpts were retrieved")
          PY

      - name: Prepare independent human-label review template
        run: python -m research.news_eval --dossier research_output/news_qwen_sources.json --output research_output/news_eval_template.json

      - name: Install free local Ollama (no paid API, no keys)
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "LOCAL_OLLAMA_READY"
              exit 0
            fi
            sleep 1
          done
          tail -n 30 /tmp/ollama-server.log
          exit 1

      - name: Pull open-weight Qwen 1.5B
        run: timeout 300 ollama pull qwen2.5:1.5b

      - name: Ask 3 source-bounded questions per retrieved real article
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path
          from research.news_chat import ask
          from research.news_eval import verify_quote, negative_control_ok

          dossier = json.loads(Path("research_output/news_qwen_sources.json").read_text(encoding="utf-8"))
          results = []
          for article in dossier["article_cases"]:
              if article["retrieval_status"] != "ARTICLE_RETRIEVED":
                  continue
              evidence = article["evidence"]
              source_excerpt = evidence["source_excerpt"]
              one_article = {"article_cases": [article]}
              questions = {
                  "direct": "Based only on the supplied excerpt, explain the main announcement. Return ONLY valid JSON with exactly 3 keys: answer (brief), quote (verbatim contiguous 15+ character passage from the excerpt), source_url (copy exact source URL). No surrounding Markdown.",
                  "inference": "Based only on the excerpt, give ONE cautious inference and explicitly distinguish publisher claims from independent proof. Return ONLY JSON with exactly keys answer, quote (exact contiguous 15+ chars from excerpt), source_url (copy URL exactly). No Markdown.",
                  "unanswerable": "According to the supplied excerpt, what is the publisher's exact audited revenue for calendar year 2031? ONLY facts explicitly in the excerpt are allowed. If no revenue for that exact year is given, answer MUST equal the literal token NOT_IN_SOURCE, never an empty string or a general verification status. Use quote as an empty string for missing evidence. Respond ONLY as JSON with exactly three keys answer, quote, source_url (copy the exact source URL). Example format for a MISSING fact: {\"answer\":\"NOT_IN_SOURCE\",\"quote\":\"\",\"source_url\":\"COPY_THE_ACTUAL_URL\"}. Do not invent numbers.",
              }
              for kind, question in questions.items():
                  entry = {
                      "type": kind,
                      "question": question,
                      "url": evidence["source"]["url"],
                      "source_sha256": evidence["source"]["sha256"],
                      "status": "MODEL_ERROR",
                  }
                  try:
                      reply = ask(question, one_article, model="qwen2.5:1.5b")
                      answer = reply.get("answer", "").strip()
                      entry["model_status"] = reply.get("status")
                      entry["answer"] = answer
                      entry["status"] = "MODEL_RESPONSE_UNVERIFIED" if answer else "EMPTY_MODEL_RESPONSE"
                      entry["valid_json"] = False
                      entry["exact_quote_found"] = False
                      entry["exact_source_url"] = False
                      entry["explicit_abstention"] = False
                      try:
                          cleaned = re.sub(r"^\x60\x60\x60(?:json)?\s*|\s*\x60\x60\x60$", "", answer.strip(), flags=re.I)
                          parsed = json.loads(cleaned)
                          if not isinstance(parsed, dict):
                              raise ValueError("Model JSON was not an object")
                          entry["valid_json"] = True
                          entry["parsed_answer"] = str(parsed.get("answer", ""))
                          entry["parsed_quote"] = str(parsed.get("quote", ""))
                          entry["model_source_url"] = str(parsed.get("source_url", ""))
                          entry["exact_source_url"] = entry["model_source_url"] == evidence["source"]["url"]
                          entry["exact_quote_found"] = verify_quote(
                              entry["parsed_quote"], source_excerpt
                          ) == "exact"
                          entry["explicit_abstention"] = negative_control_ok(
                              entry["parsed_answer"], entry["parsed_quote"],
                              entry["model_source_url"], evidence["source"]["url"]
                          )
                      except (json.JSONDecodeError, ValueError, TypeError) as exc:
                          entry["json_error"] = f"{type(exc).__name__}: {exc}"[:160]
                  except Exception as exc:
                      entry["error"] = f"{type(exc).__name__}: {exc}"[:300]
                  results.append(entry)
                  print("QWEN_CASE:", kind, entry["status"], "quote=", entry.get("exact_quote_found", False))
          answered = sum(row["status"] == "MODEL_RESPONSE_UNVERIFIED" for row in results)
          quoted = sum(row.get("exact_quote_found", False) for row in results)
          negative_rows = [r for r in results if r["type"] == "unanswerable"]
          negative_pass = sum(r.get("explicit_abstention", False) for r in negative_rows)
          json_pass = sum(r.get("valid_json", False) for r in results)
          url_pass = sum(r.get("exact_source_url", False) for r in results)
          gate_pass = (
              len(negative_rows) >= 3 and negative_pass == len(negative_rows)
              and quoted >= 9 and json_pass == len(results)
              and url_pass == len(results)
          )
          summary = {
              "generated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "model": "qwen2.5:1.5b",
              "real_articles_retrieved": sum(x["retrieval_status"] == "ARTICLE_RETRIEVED" for x in dossier["article_cases"]),
              "question_attempts": len(results),
              "model_responses": answered,
              "exact_quote_matches_in_model_responses": quoted,
              "valid_json_responses": sum(row.get("valid_json", False) for row in results),
              "exact_source_url_matches": sum(row.get("exact_source_url", False) for row in results),
              "exact_negative_control_abstentions": negative_pass,
              "negative_control_attempts": len(negative_rows),
              "strict_mechanical_gate_passed": gate_pass,
              "status": "MECHANICAL_EVIDENCE_GATES_PASSED" if gate_pass else "MECHANICAL_EVIDENCE_GATES_FAILED",
              "does_not_establish": [
                  "answer accuracy", "semantic entailment", "independent truth verification",
                  "human gold-label scores", "cross-publisher generalization"
              ],
              "results": results,
          }
          Path("research_output/news_qwen_probe.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("REAL_ARTICLES:", summary["real_articles_retrieved"])
          print("QWEN_QUESTIONS:", len(results))
          print("QWEN_RESPONSES:", answered)
          print("EXACT_QUOTE_MATCHES:", quoted)
          print("VALID_JSON_RESPONSES:", summary["valid_json_responses"])
          print("EXACT_SOURCE_URL_MATCHES:", summary["exact_source_url_matches"])
          print("NEGATIVE_CONTROL_ABSTENTIONS:", summary["exact_negative_control_abstentions"])
          if not answered:
              raise SystemExit("FAIL_CLOSED: no Qwen response on real article evidence")
          if not quoted:
              raise SystemExit("FAIL_CLOSED: no exact model-provided source quote")
          if not gate_pass:
              raise SystemExit("FAIL_CLOSED: negative-control, URL, JSON, or quote baseline gate unmet")
          PY

      - name: Audit provenance and quarantine unsupported answers
        if: always()
        run: |
          if [ -s research_output/news_qwen_sources.json ] && [ -s research_output/news_qwen_probe.json ]; then
            python -m research.news_probe_audit \
              --sources research_output/news_qwen_sources.json \
              --probe research_output/news_qwen_probe.json \
              --output research_output/news_audit.json
          else
            echo "No complete source/model evidence available for replay audit."
          fi

      - name: Prepare unlabelled semantic entailment review packet
        if: always()
        run: |
          if [ -s research_output/news_qwen_sources.json ] && [ -s research_output/news_qwen_probe.json ] && [ -s research_output/news_audit.json ]; then
            python -m research.news_semantic_review \
              --sources research_output/news_qwen_sources.json \
              --probe research_output/news_qwen_probe.json \
              --audit research_output/news_audit.json \
              --output research_output/news_semantic_review_packet.json
          else
            echo "Insufficient archived inputs for independent semantic review."
          fi

      - name: Preserve empirical evidence and failed-source reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-news-qwen-evidence
          path: |
            research_output/news_qwen_sources.json
            research_output/news_qwen_probe.json
            research_output/news_eval_template.json
            research_output/news_audit.json
            research_output/news_semantic_review_packet.json
          if-no-files-found: warn
          retention-days: 7
