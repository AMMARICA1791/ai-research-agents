name: Radar Historical Portfolio Council
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/rapid_project_radar/backfill_review.py'
      - '.github/workflows/radar-historical-council.yml'
permissions:
  contents: write
jobs:
  review-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: historical-portfolio-council
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect historical project evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m experiments.rapid_project_radar.portfolio --repo ${{ github.repository }} --output /tmp/historical-radar-inventory.json
      - name: Run council on all historical projects
        run: python -m experiments.rapid_project_radar.backfill_review --inventory /tmp/historical-radar-inventory.json --output /tmp/historical-council
      - name: Publish English portfolio review to main
        run: |
          set -eu
          mkdir -p docs/radar-council
          cp /tmp/historical-council/PORTFOLIO_COUNCIL_REVIEW.md docs/radar-council/PORTFOLIO_COUNCIL_REVIEW.md
          cp /tmp/historical-council/portfolio_reviews.json docs/radar-council/portfolio_reviews.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/radar-council/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish historical council project review'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive complete council evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-council-review
          path: /tmp/historical-council/
          if-no-files-found: warn
          retention-days: 30
