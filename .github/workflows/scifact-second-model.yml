name: SciFact Second Model Comparison

on:
  pull_request:
    paths:
      - 'research/compare_scifact_model.py'
      - '.github/workflows/scifact-second-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.40,<5' sentencepiece protobuf
      - name: Evaluate second model on all 338 annotated SciFact dev rationales
        run: python -m research.compare_scifact_model --output-dir scifact-model-comparison
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scifact-second-model-results
          path: |
            scifact-model-comparison/report.json
            scifact-model-comparison/errors.json
            scifact-model-comparison/predictions.json
          if-no-files-found: warn
