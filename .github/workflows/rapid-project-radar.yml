name: Rapid Project Radar
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [experiment/rapid-project-radar]
    paths:
      - 'experiments/rapid_project_radar/**'
      - '.github/workflows/rapid-project-radar.yml'
  pull_request:
    paths:
      - 'experiments/rapid_project_radar/**'
      - '.github/workflows/rapid-project-radar.yml'
permissions:
  contents: read
jobs:
  test-and-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests
        run: python -m unittest discover -s experiments/rapid_project_radar -p 'test_*.py' -v
      - name: Fetch public research signals
        run: python -m experiments.rapid_project_radar.radar --output /tmp/rapid-radar-report.json
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapid-radar-report
          path: /tmp/rapid-radar-report.json
          if-no-files-found: warn
          retention-days: 7
