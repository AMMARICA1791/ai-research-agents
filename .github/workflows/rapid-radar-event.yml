name: Rapid Radar Event Intake
on:
  repository_dispatch:
    types: [rapid_news_signal]
  workflow_dispatch:
    inputs:
      title:
        description: 'News headline'
        required: true
        type: string
      url:
        description: 'Source HTTPS URL'
        required: true
        type: string
permissions:
  contents: write
jobs:
  inspect-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline tests
        run: python -m unittest discover -s experiments/rapid_project_radar -p 'test_*.py' -v
      - name: Create inert opportunity proposal
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_TITLE: ${{ inputs.title }}
          MANUAL_URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import json,os
          payload=json.loads(os.environ.get('DISPATCH_PAYLOAD') or '{}')
          if not payload:
              payload={'title':os.environ.get('MANUAL_TITLE',''),'url':os.environ.get('MANUAL_URL','')}
          with open('/tmp/radar-event.json','w') as f: json.dump(payload,f)
          PY
          python -m experiments.rapid_project_radar.event_intake --input /tmp/radar-event.json --output /tmp/radar-proposal.json
      - name: Build validated event radar report
        run: |
          python - <<'PY'
          import json
          from experiments.rapid_project_radar.event_intake import to_radar_report
          with open('/tmp/radar-event.json', encoding='utf-8') as f:
              event = json.load(f)
          with open('/tmp/radar-event-report.json', 'w', encoding='utf-8') as f:
              json.dump(to_radar_report(event), f)
          PY
      - name: Generate signal-specific project
        run: python -m experiments.rapid_project_radar.anticipate --report /tmp/radar-event-report.json --output-dir /tmp/event-projects
      - name: Historical portfolio inventory
        continue-on-error: true
        env:
          GH_TOKEN: \${{ github.token }}
        run: python -m experiments.rapid_project_radar.portfolio --repo \${{ github.repository }} --output /tmp/radar-portfolio.json
      - name: Council review before publishing
        run: |
          if [ -f /tmp/radar-portfolio.json ]; then
            python -m experiments.rapid_project_radar.council --projects /tmp/event-projects --portfolio /tmp/radar-portfolio.json
          else
            python -m experiments.rapid_project_radar.council --projects /tmp/event-projects
          fi
      - name: Run experiments and preserve failures as learning
        run: |
          set -eu
          for dir in /tmp/event-projects/*; do
            [ -d "$dir" ] || continue
            if (cd "$dir" && python -m unittest discover -s . -p 'test_*.py' -v); then
              PYTHONPATH="$GITHUB_WORKSPACE" python -m experiments.rapid_project_radar.learning --project "$dir" --outcome PASS --observation "Initial scaffold tests passed; scientific hypothesis remains unverified."
            else
              PYTHONPATH="$GITHUB_WORKSPACE" python -m experiments.rapid_project_radar.learning --project "$dir" --outcome FAIL --observation "Initial scaffold tests failed; preserve this experiment for investigation." --correction "Inspect test output, revise hypothesis or implementation, and retry."
            fi
          done
      - name: Publish isolated project branch
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in /tmp/event-projects/*; do
            [ -d "$dir" ] || continue
            project_id="$(basename "$dir")"
            branch="radar/incubator-$project_id"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Already exists: $branch"
              continue
            fi
            git switch -c "$branch" origin/main
            mkdir -p "projects/incubator/$project_id"
            cp -R "$dir"/. "projects/incubator/$project_id/"
            git add "projects/incubator/$project_id"
            git commit -m "experiment: event-driven incubator $project_id"
            git push origin "$branch"
            git switch --detach "\${{ github.sha }}"
            git branch -D "$branch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: radar-event-proposal
          path: |
            /tmp/radar-proposal.json
            /tmp/radar-event-report.json
            /tmp/event-projects/
          retention-days: 14
