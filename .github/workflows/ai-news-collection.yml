name: AI News Collection Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public AI headlines
        run: python -m research.ai_news_feed --output research_output/ai_news.json
      - name: Display collection summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("research_output/ai_news.json",encoding="utf-8"))
          print("Stories:",len(p["stories"]))
          print("Feed errors:",p["source_errors"])
          for item in p["stories"][:10]:
              print(item["source"],"|",item["title"],"|",item["url"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-news-inventory
          path: research_output/ai_news.json
          if-no-files-found: warn
          retention-days: 7
