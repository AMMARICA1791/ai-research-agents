name: AI News Collection Pilot

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'Optional public HTTPS article URL to analyze directly'
        required: false
        type: string
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public AI headlines
        run: python -m research.ai_news_feed --output research_output/ai_news.json
      - name: Retrieve articles and prepare source dossiers
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
        run: |
          if [ -n "$ARTICLE_URL" ]; then
            python -m research.news_research_pipeline --url "$ARTICLE_URL" --output research_output/news_research.json
          else
            python -m research.news_research_pipeline --output research_output/news_research.json --max-articles 3
          fi
      - name: Produce human-readable evidence report
        run: python -m research.news_report --dossier research_output/news_research.json --output research_output/news_report.md
      - name: Show retrieved article count
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research_output/news_research.json',encoding='utf-8'))
          retrieved=sum(x['retrieval_status']=='ARTICLE_RETRIEVED' for x in p['article_cases'])
          print('Article cases:',len(p['article_cases']))
          print('Retrieved:',retrieved)
          for x in p['article_cases']:
              print(x['retrieval_status'], x['url'], x.get('error',''))
          if retrieved == 0:
              raise SystemExit('No articles retrieved; cannot claim successful live-source demo')
          PY
      - name: Display collection summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("research_output/ai_news.json",encoding="utf-8"))
          print("Stories:",len(p["stories"]))
          print("Feed errors:",p["source_errors"])
          for item in p["stories"][:10]:
              print(item["source"],"|",item["title"],"|",item["url"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-news-inventory
          path: |
            research_output/ai_news.json
            research_output/news_research.json
            research_output/news_report.md
          if-no-files-found: warn
          retention-days: 7
