name: Research Lab - Manual Mission
on:
  workflow_dispatch:
    inputs:
      goal:
        description: 'Read-only research mission for this lab'
        required: true
        default: 'Inspect this research laboratory and propose the next improvements'
        type: string
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LAB_GOAL: "${{ inputs.goal }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run five-stage research cycle (no model key required)
        run: |
          python -m lab.cli mission --repo . --goal "$LAB_GOAL" --output results/mission.json
      - name: Keep report and SQLite memory as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab-mission-${{ github.run_id }}
          path: |
            results/mission.json
            .data/lab.sqlite
          retention-days: 14
