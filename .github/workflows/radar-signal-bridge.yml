name: Radar Signal Bridge
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-signal-bridge.yml'
      - 'projects/signal-bridge/**'
  workflow_run:
    workflows: [Rapid Project Radar]
    types: [completed]
permissions:
  contents: read
jobs:
  publish-evidence:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Signal Bridge
        run: python -m unittest discover -s projects/signal-bridge -p 'test_*.py' -v
      - name: Collect actual public radar signals
        run: python -m experiments.rapid_project_radar.radar --output /tmp/radar-report.json
      - name: Generate source-linked connections
        run: python projects/signal-bridge/bridge.py --report /tmp/radar-report.json --output /tmp/radar-connections.json
      - name: Publish radar-born project output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-signal-bridge-output
          path: |
            /tmp/radar-report.json
            /tmp/radar-connections.json
          if-no-files-found: warn
          retention-days: 14
