name: Reproducible bug report
description: Report a public, non-sensitive problem with evidence
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private code or vulnerability exploit details. Security reports: see SECURITY.md."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal public reproduction
      placeholder: Provide a small synthetic input, test, or workflow run URL.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, operating system and commit
    validations:
      required: false
