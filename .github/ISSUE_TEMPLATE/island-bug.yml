name: Island bug report
description: Report a reproducible issue in one radar project island
title: "[island] "
labels: ["bug", "island"]
body:
  - type: input
    id: island
    attributes:
      label: Island ID
      description: Exact folder name under projects/incubator/
      placeholder: source_claim-example
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands and minimal non-sensitive input
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove secrets and personal data before posting
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed fix or investigation
    validations:
      required: false
